name: build-libvoicefx
on: [push, workflow_dispatch]
jobs:
  test:                       # engine tests on the runner (stand-in for RubberBand), ~20 s
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host tests
        run: |
          g++ -std=c++17 -O2 -ffast-math -fno-finite-math-only -I test/fake test/host_test.cpp -o host_test
          ./host_test
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch RubberBand 4.0.0 (GPL-2.0+, not stored in this repo)
        run: |
          mkdir -p jni/rubberband-src
          curl -fL https://codeload.github.com/breakfastquay/rubberband/tar.gz/refs/tags/v4.0.0 | tar xz --strip-components=1 -C jni/rubberband-src
          ls jni/rubberband-src/single/RubberBandSingle.cpp jni/rubberband-src/rubberband/RubberBandLiveShifter.h
      - name: ndk-build (armeabi-v7a)
        run: |
          $ANDROID_NDK_HOME/ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=jni/Android.mk NDK_APPLICATION_MK=jni/Application.mk -j2
          file libs/armeabi-v7a/libvoicefx.so
          readelf -d libs/armeabi-v7a/libvoicefx.so | grep NEEDED
          nm -D --defined-only libs/armeabi-v7a/libvoicefx.so | grep -E '__GetModInfo|OnModLoad|OnModPreLoad|vc_api|vfx_'
      - uses: actions/upload-artifact@v4
        with:
          name: libvoicefx
          path: libs/armeabi-v7a/libvoicefx.so
